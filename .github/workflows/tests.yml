name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'config.example.json'
      - 'profiles/**'
      - 'deploy/**'
      - 'web/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg for synthetic media checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run offline unit and integration tests
        run: python -m unittest discover -p 'test_*.py'
      - name: Check deployment helpers with isolated temporary state
        run: python -m unittest discover -s deploy -p 'test_*.py'
      - name: Check patch formatting
        run: git diff --check
