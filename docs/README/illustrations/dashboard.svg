<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">K1C Control — демонстрационный пульт</title>
  <desc id="desc">Схематичная иллюстрация закрытого веб-пульта и Telegram. Все показатели вымышлены. Камера заменена рисунком принтера; реальных кадров, пользователей и записей нет.</desc>
  <defs>
    <linearGradient id="background" x1="35" y1="20" x2="1200" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#151a2c"/><stop offset="1" stop-color="#080d18"/></linearGradient>
    <linearGradient id="accent" x1="621" y1="255" x2="849" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient>
    <linearGradient id="glass" x1="640" y1="220" x2="980" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#1d2938"/><stop offset="1" stop-color="#101926"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#596a80" stroke-opacity=".10"/></pattern>
    <filter id="shadow" x="360" y="50" width="920" height="650" filterUnits="userSpaceOnUse"><feDropShadow dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
    <clipPath id="round"><rect width="1280" height="720" rx="24"/></clipPath>
    <clipPath id="camera"><rect x="582" y="209" width="350" height="246" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="720" fill="url(#background)"/>
    <rect width="1280" height="720" fill="url(#grid)"/>
    <circle cx="1066" cy="103" r="290" fill="#7c3aed" opacity=".05"/>
    <circle cx="558" cy="700" r="270" fill="#14b8a6" opacity=".035"/>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
