      <text x="88" y="63" fill="#c1c9d8" font-size="12" font-weight="700" letter-spacing="2.5">YOUR PRINTER. YOUR SERVER.</text>
      <text x="48" y="130" fill="#f3f5fb" font-size="51" font-weight="750" letter-spacing="-2">K1C Control</text>
      <text x="49" y="170" fill="#d4c8ff" font-size="18" font-weight="600">От файла — до готовой детали.</text>
      <text x="49" y="205" fill="#94a2b7" font-size="15">Telegram и закрытый веб-пульт</text>
      <text x="49" y="229" fill="#94a2b7" font-size="15">с общей очередью и подготовкой.</text>

