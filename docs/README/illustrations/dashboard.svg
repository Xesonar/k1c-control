      <text x="70" y="401" fill="#91a2b9" font-size="13">demo-part.gcode</text>
      <path d="m72 427 4 4 8-9" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="431" fill="#b8c7d8" font-size="13">Новый замер перед печатью</text>
